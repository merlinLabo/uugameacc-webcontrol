location = /uu-gameacc.js {
    include /usr/share/unifi-core/http/security.conf;
    alias /data/uuplugin-webcontrol/uu-gameacc.js;
    add_header Cache-Control "no-store" always;
}

location = /uu-gameacc.svg {
    include /usr/share/unifi-core/http/security.conf;
    alias /data/uuplugin-webcontrol/games.svg;
    add_header Cache-Control "no-store" always;
}

location /proxy/network/uu-gameacc/ {
    include /usr/share/unifi-core/http/security.conf;
    include /usr/share/unifi-core/http/auth.conf;
    include /usr/share/unifi-core/http/proxy.conf;
    proxy_pass http://127.0.0.1:17663/;
}
